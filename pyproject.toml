[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apagent"
version = "0.1.0"
description = "AP Invoice Exception Agent: suggests reasons and next steps for AP invoice holds. Read-only. Human approves."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
